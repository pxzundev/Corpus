[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/mcp", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# image-models is left off: this app embeds text only, and that feature pulls
# the whole image codec stack (image, tiff, exr, ravif) into the bundle.
fastembed = { version = "6", default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }

[profile.release]
lto = "thin"
