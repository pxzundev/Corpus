# Builds the release artifacts on real macOS and Windows runners and assembles
# a draft GitHub release for the pushed tag. Publish it manually after review.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri-cli
        run: cargo install tauri-cli --version 2 --locked
      - name: Build the app bundle and dmg
        run: cargo tauri build
      - name: Package the CLI zip
        run: |
          zip -j "Corpus-${GITHUB_REF_NAME}-macos-arm64.zip" \
            target/release/corpus target/release/corpus-mcp scripts/install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: Corpus-*-macos-arm64.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # corpus-mcp first: the GUI build script validates the bundled resource
      # path, so the server binary must exist before corpus-gui compiles.
      - name: Build the workspace
        run: |
          cargo build --release -p corpus-mcp
          cargo build --release --workspace
      - name: Package the Windows zip
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\corpus-gui.exe, target\release\corpus.exe, `
            target\release\corpus-mcp.exe, scripts\install.ps1 `
            -DestinationPath "Corpus-$env:GITHUB_REF_NAME-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Corpus-*-windows-x64.zip

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Write the draft notes
        run: |
          cat > release-notes.md <<'NOTES'
          First public release of Corpus — a local-first RAG knowledge base that speaks MCP.

          ## Downloads

          | File | What it is |
          | --- | --- |
          | `Corpus_0.1.0_aarch64.dmg` | The macOS app (Apple silicon). Self-contained: it carries its own MCP server and places it in the data folder on first launch. |
          | `Corpus-v0.1.0-macos-arm64.zip` | CLI tools (`corpus`, `corpus-mcp`) plus `install.sh` for macOS/Linux. |
          | `Corpus-v0.1.0-windows-x64.zip` | The three exe files (`corpus-gui.exe`, `corpus.exe`, `corpus-mcp.exe`) plus `install.ps1`. |

          ## Getting started

          - **macOS:** open the dmg, drag `Corpus.app` into Applications, right-click → Open once
            (the bundle is ad-hoc signed, so Gatekeeper asks to confirm). The ~562 MB of
            embedding models download on first launch.
          - **Windows:** unzip anywhere and double-click `corpus-gui.exe`. WebView2 is
            preinstalled on Windows 11; on Windows 10 install it from Microsoft if missing.
          - **Connect your harness or MCP client:** click the **MCP** button in the Chat
            header, **Copy JSON**, paste the block into your client's `mcpServers` config.
            The `search_docs` and `list_documents` tools need no engine, API key or model.
          - **Chat and vision** need your own local engine (LM Studio or similar) — see the
            README's "Connecting an inference engine" section.

          Full install, run and uninstall instructions are in the README.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "${{ github.ref_name }} — first release"
          body_path: release-notes.md
          files: |
            dist/macos-dmg/*
            dist/macos-zip/*
            dist/windows-zip/*
